<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Ran Daskal</title>
  <meta name="description" content="Get in touch with Ran Daskal for motion design and art direction projects.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260923130829">
</head>
<body data-page="contact">

  <header class="wrap site-header" id="site-header"></header>

  <main class="wrap">
    <section class="contact">
      <div class="contact-info">
        <h1>Let's talk.</h1>
        <p>Have a project in mind, or just want to say hi? Send a note and I'll get back to you within a day or two.</p>
        <p><a class="email" data-site="email" href="#"></a></p>
        <p class="mono muted" data-site="location"></p>

        <div class="socials">
          <a data-site="instagram" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>
            Instagram
          </a>
          <a data-site="linkedin" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/></svg>
            LinkedIn
          </a>
        </div>
      </div>

      <form class="form" id="contact-form" method="POST" action="#" novalidate>
        <div class="row-2">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit">Send</button>
        <div class="form-note" id="form-note" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="wrap site-footer" id="site-footer"></footer>

  <script src="js/projects.js?v=20260923130829"></script>
  <script src="js/main.js?v=20260923130829"></script>
  <script src="js/fx.js?v=20260923130829"></script>
</body>
</html>
